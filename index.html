<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rm Obook Pro</title>
    <link rel="manifest" href="/obook/manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.88/epub.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --indigo: #4f46e5; }
        body.dark-mode { --bg: #0f172a; --card: #1e293b; color: #f1f5f9; }
        
        #viewer { height: 70vh; width: 100%; border-radius: 12px; }
        .hidden { display: none; }
        
        /* Highlight Menu */
        #highlightMenu { 
            display: none; position: fixed; z-index: 100; 
            background: var(--card); border-radius: 30px; padding: 8px 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); gap: 12px;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .hl-btn { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .hl-btn:hover { border-color: gray; }
        
        /* Drawer for Bookmarks */
        #drawer {
            position: fixed; top: 0; right: -300px; width: 300px; height: 100%;
            background: var(--card); z-index: 60; transition: 0.3s;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1); padding: 20px;
        }
        #drawer.open { right: 0; }
        
        mark.hl-yellow { background: #fef08a; color: black; }
        mark.hl-green { background: #bbf7d0; color: black; }
        mark.hl-pink { background: #fbcfe8; color: black; }
    </style>
</head>
<body class="bg-[var(--bg)] font-sans">

    <div id="app" class="max-w-2xl mx-auto p-4">
        <header class="flex justify-between items-center py-4">
            <h1 class="text-3xl font-extrabold text-indigo-600">Rm Obook</h1>
            <div class="flex gap-2">
                <button id="themeToggle" class="p-2 rounded-xl bg-gray-200 dark:bg-gray-700">🌙</button>
                <button id="addBtn" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold">+</button>
            </div>
        </header>

        <div id="library" class="grid grid-cols-2 sm:grid-cols-3 gap-4 mt-4"></div>

        <div id="readerContainer" class="hidden fixed inset-0 bg-[var(--bg)] z-50 p-4 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <button onclick="closeReader()" class="text-indigo-600 font-bold">← Library</button>
                <div class="flex gap-3">
                    <button onclick="addBookmark()" class="text-xl">🔖</button>
                    <button onclick="toggleDrawer()" class="text-xl">📋</button>
                    <button id="viewModeBtn" onclick="toggleView()" class="text-xs bg-gray-200 dark:bg-gray-800 px-3 py-1 rounded-lg">Swipe</button>
                </div>
            </div>
            
            <div id="viewer" class="shadow-xl bg-[var(--card)]"></div>

            <div id="navControls" class="flex justify-between p-6 mt-auto">
                <button id="prevBtn" class="bg-indigo-50 dark:bg-gray-800 px-8 py-4 rounded-2xl font-bold transition active:scale-90">Prev</button>
                <button id="nextBtn" class="bg-indigo-50 dark:bg-gray-800 px-8 py-4 rounded-2xl font-bold transition active:scale-90">Next</button>
            </div>
        </div>

        <div id="drawer">
            <div class="flex justify-between mb-6">
                <h2 class="text-xl font-bold">Bookmarks</h2>
                <button onclick="toggleDrawer()">✕</button>
            </div>
            <div id="bookmarkList" class="space-y-3"></div>
        </div>

        <div id="highlightMenu" class="items-center">
            <div class="hl-btn bg-yellow-300" onclick="applyHighlight('hl-yellow')"></div>
            <div class="hl-btn bg-green-300" onclick="applyHighlight('hl-green')"></div>
            <div class="hl-btn bg-pink-300" onclick="applyHighlight('hl-pink')"></div>
            <div class="h-4 w-[1px] bg-gray-300 mx-1"></div>
            <button onclick="clearSelection()" class="text-xs font-bold text-gray-500">Done</button>
        </div>

        <input type="file" id="fileInput" accept=".epub,.pdf,.txt" class="hidden">
    </div>

    <script>
        let rendition, currentBook, currentBookKey, viewMode = 'paginated';
        const viewer = document.getElementById('viewer');

        // --- Core Functions ---
        window.onload = loadLibrary;
        document.getElementById('addBtn').onclick = () => document.getElementById('fileInput').click();

        async function loadLibrary() {
            const lib = document.getElementById('library'); lib.innerHTML = '';
            await localforage.iterate((v, k) => {
                const div = document.createElement('div');
                div.className = "bg-[var(--card)] p-4 rounded-2xl shadow-sm cursor-pointer border dark:border-gray-700";
                div.innerHTML = `<p class='font-bold truncate'>${v.name}</p><p class='text-[10px] opacity-50'>${v.type.toUpperCase()}</p>`;
                div.onclick = () => openReader(k);
                lib.appendChild(div);
            });
        }

        async function openReader(k) {
            currentBookKey = k;
            const file = await localforage.getItem(k);
            document.getElementById('readerContainer').classList.remove('hidden');
            
            if (file.type === 'epub') {
                currentBook = ePub(file.data);
                rendition = currentBook.renderTo("viewer", { width: "100%", height: "100%", flow: viewMode });
                rendition.display(file.progress);
                
                rendition.on("relocated", (loc) => {
                    file.progress = loc.start.cfi;
                    localforage.setItem(k, file);
                });

                document.getElementById('nextBtn').onclick = () => rendition.next();
                document.getElementById('prevBtn').onclick = () => rendition.prev();
            }
            updateBookmarkList();
        }

        // --- Bookmark Logic ---
        async function addBookmark() {
            const file = await localforage.getItem(currentBookKey);
            const label = prompt("Bookmark Name:", "Important Page");
            if (!label) return;

            if (!file.bookmarks) file.bookmarks = [];
            const loc = rendition ? rendition.currentLocation().start.cfi : null;
            
            file.bookmarks.push({ label, loc, date: new Date().toLocaleDateString() });
            await localforage.setItem(currentBookKey, file);
            updateBookmarkList();
        }

        async function updateBookmarkList() {
            const file = await localforage.getItem(currentBookKey);
            const list = document.getElementById('bookmarkList');
            list.innerHTML = '';
            (file.bookmarks || []).forEach((bm, index) => {
                const item = document.createElement('div');
                item.className = "p-3 bg-indigo-50 dark:bg-gray-800 rounded-lg cursor-pointer hover:bg-indigo-100 transition";
                item.innerHTML = `<p class='text-sm font-bold'>${bm.label}</p><p class='text-[10px] opacity-50'>${bm.date}</p>`;
                item.onclick = () => { rendition.display(bm.loc); toggleDrawer(); };
                list.appendChild(item);
            });
        }

        // --- Highlight UI Logic ---
        document.addEventListener('mouseup', (e) => {
            const selection = window.getSelection();
            if (selection.toString().length > 2) {
                const menu = document.getElementById('highlightMenu');
                menu.style.display = 'flex';
                menu.style.top = `${e.clientY - 60}px`;
                menu.style.left = `${e.clientX - 50}px`;
            } else {
                document.getElementById('highlightMenu').style.display = 'none';
            }
        });

        function applyHighlight(color) {
            const selection = window.getSelection();
            if (selection.rangeCount > 0) {
                const range = selection.getRangeAt(0);
                const mark = document.createElement('mark');
                mark.className = color;
                range.surroundContents(mark);
            }
            clearSelection();
        }

        function clearSelection() { window.getSelection().removeAllRanges(); document.getElementById('highlightMenu').style.display = 'none'; }
        function toggleDrawer() { document.getElementById('drawer').classList.toggle('open'); }
        function toggleView() { 
            viewMode = (viewMode === 'paginated') ? 'scrolled' : 'paginated';
            document.getElementById('viewModeBtn').innerText = viewMode === 'paginated' ? 'Swipe' : 'Scroll';
            location.reload(); // Reloading is the safest way to reset the ePub engine flow
        }
        function closeReader() { document.getElementById('readerContainer').classList.add('hidden'); location.reload(); }
        document.getElementById('themeToggle').onclick = () => document.body.classList.toggle('dark-mode');
    </script>
</body>
</html>
