<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rm Obook Pro</title>
    <link rel="manifest" href="/obook/manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.88/epub.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; }
        body.dark-mode { --bg: #0f172a; --card: #1e293b; color: #f1f5f9; }
        #viewer { height: 70vh; width: 100%; border-radius: 12px; overflow: hidden; position: relative; }
        .hidden { display: none; }
        #drawer { position: fixed; top: 0; right: -320px; width: 300px; height: 100%; background: var(--card); z-index: 100; transition: 0.3s; box-shadow: -5px 0 15px rgba(0,0,0,0.1); padding: 20px; }
        #drawer.open { right: 0; }
        #highlightMenu { display: none; position: fixed; z-index: 1000; background: var(--card); border-radius: 30px; padding: 8px 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); gap: 12px; border: 1px solid rgba(0,0,0,0.1); }
        .hl-btn { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; }
        mark.hl-yellow { background: #fef08a; color: black; }
        mark.hl-green { background: #bbf7d0; color: black; }
        mark.hl-pink { background: #fbcfe8; color: black; }
    </style>
</head>
<body class="bg-[var(--bg)] font-sans">

    <div id="app" class="max-w-2xl mx-auto p-4">
        <header class="flex justify-between items-center py-4">
            <h1 class="text-3xl font-extrabold text-indigo-600">Rm Obook</h1>
            <div class="flex gap-2">
                <button onclick="showStats()" class="p-2 bg-indigo-50 dark:bg-gray-800 rounded-xl">📊</button>
                <button id="themeToggle" class="p-2 bg-gray-200 dark:bg-gray-700 rounded-xl">🌙</button>
                <button id="addBtn" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold">+</button>
            </div>
        </header>

        <input type="text" id="searchBar" placeholder="Search library..." class="w-full p-3 mb-6 rounded-xl border dark:bg-gray-800 dark:border-gray-700 outline-none">

        <div id="library" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>

        <div id="readerContainer" class="hidden fixed inset-0 bg-[var(--bg)] z-50 p-4 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <button onclick="closeReader()" class="text-indigo-600 font-bold">← Back</button>
                <div class="flex gap-4">
                    <button onclick="addBookmark()">🔖</button>
                    <button onclick="toggleDrawer()">📋</button>
                </div>
            </div>
            <div id="viewer" class="bg-[var(--card)] shadow-xl"></div>
            <div id="navControls" class="flex justify-between p-6 mt-auto">
                <button id="prevBtn" class="bg-gray-200 dark:bg-gray-800 px-6 py-3 rounded-xl">Prev</button>
                <span id="pageInfo" class="text-xs self-center"></span>
                <button id="nextBtn" class="bg-gray-200 dark:bg-gray-800 px-6 py-3 rounded-xl">Next</button>
            </div>
        </div>

        <div id="statsOverlay" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[110] flex items-center justify-center p-6">
            <div class="bg-[var(--card)] w-full max-w-sm rounded-3xl p-8 shadow-2xl">
                <h2 class="text-2xl font-bold mb-4">Reading Stats</h2>
                <div id="statsContent" class="space-y-4"></div>
                <button onclick="document.getElementById('statsOverlay').classList.add('hidden')" class="mt-6 w-full bg-indigo-600 text-white py-3 rounded-xl">Close</button>
            </div>
        </div>

        <div id="drawer">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Bookmarks</h2>
                <button onclick="toggleDrawer()" class="text-2xl">✕</button>
            </div>
            <div id="bookmarkList" class="space-y-3"></div>
        </div>

        <div id="highlightMenu" class="items-center">
            <div class="hl-btn bg-yellow-300" onclick="applyHighlight('hl-yellow')"></div>
            <div class="hl-btn bg-green-300" onclick="applyHighlight('hl-green')"></div>
            <div class="hl-btn bg-pink-300" onclick="applyHighlight('hl-pink')"></div>
            <button onclick="clearSelection()" class="text-xs font-bold text-gray-400 ml-2">✕</button>
        </div>

        <input type="file" id="fileInput" accept=".epub,.pdf,.txt" class="hidden">
    </div>

    <script>
        let rendition, currentBook, currentBookKey, allBooks = {};
        const viewer = document.getElementById('viewer');

        // --- 1. FIXED FILE UPLOAD (.TXT FIX) ---
        document.getElementById('addBtn').onclick = () => document.getElementById('fileInput').click();
        document.getElementById('fileInput').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const type = file.name.split('.').pop().toLowerCase();
            const reader = new FileReader();

            reader.onload = async (evt) => {
                const id = 'file_' + Date.now();
                await localforage.setItem(id, {
                    name: file.name,
                    data: evt.target.result,
                    type: type,
                    progress: null,
                    bookmarks: [],
                    addedDate: Date.now(),
                    lastRead: null
                });
                loadLibrary();
            };

            if (type === 'txt') reader.readAsText(file);
            else reader.readAsArrayBuffer(file);
        };

        // --- 2. LIBRARY ENGINE ---
        async function loadLibrary() {
            const lib = document.getElementById('library'); lib.innerHTML = '';
            await localforage.iterate((v, k) => {
                const div = document.createElement('div');
                div.className = "bg-[var(--card)] p-4 rounded-2xl shadow-sm border dark:border-gray-700 cursor-pointer";
                div.innerHTML = `<div class='text-2xl mb-2'>${v.type==='pdf'?'📄':v.type==='txt'?'📝':'📕'}</div>
                                 <p class='font-bold truncate text-sm'>${v.name}</p>`;
                div.onclick = () => openReader(k);
                lib.appendChild(div);
            });
        }

        // --- 3. MULTI-FORMAT READER ---
        async function openReader(k) {
            currentBookKey = k;
            const file = await localforage.getItem(k);
            file.lastRead = Date.now();
            await localforage.setItem(k, file);

            document.getElementById('readerContainer').classList.remove('hidden');
            viewer.innerHTML = ''; viewer.style.overflowY = "hidden";

            if (file.type === 'epub') {
                currentBook = ePub(file.data);
                rendition = currentBook.renderTo("viewer", { width: "100%", height: "100%", flow: "paginated" });
                rendition.display(file.progress);
                rendition.on("relocated", (loc) => { 
                    file.progress = loc.start.cfi; 
                    localforage.setItem(k, file);
                    document.getElementById('pageInfo').innerText = `Progress: ${Math.round(currentBook.locations.percentageFromCfi(loc.start.cfi)*100)}%`;
                });
                document.getElementById('nextBtn').onclick = () => rendition.next();
                document.getElementById('prevBtn').onclick = () => rendition.prev();
            } else if (file.type === 'txt') {
                viewer.style.overflowY = "auto";
                viewer.innerHTML = `<div class="p-6 font-serif text-lg leading-relaxed whitespace-pre-wrap">${file.data}</div>`;
                document.getElementById('navControls').classList.add('hidden');
            }
        }

        // --- 4. READING STATS ---
        async function showStats() {
            let total = 0, finished = 0, recent = 0;
            await localforage.iterate((v) => {
                total++;
                if (v.progress && v.progress.includes('100')) finished++;
                if (v.lastRead && (Date.now() - v.lastRead < 86400000)) recent++;
            });
            document.getElementById('statsContent').innerHTML = `
                <div class="flex justify-between"><span>Total Books:</span><b>${total}</b></div>
                <div class="flex justify-between"><span>Finished:</span><b>${finished}</b></div>
                <div class="flex justify-between"><span>Read Today:</span><b>${recent}</b></div>
            `;
            document.getElementById('statsOverlay').classList.remove('hidden');
        }

        // --- 5. UTILS (Bookmarks, Highlights, Theme) ---
        function toggleDrawer() { document.getElementById('drawer').classList.toggle('open'); updateBookmarkList(); }
        async function addBookmark() {
            const file = await localforage.getItem(currentBookKey);
            const name = prompt("Bookmark Name:");
            if (name) {
                file.bookmarks.push({ name, loc: rendition.currentLocation().start.cfi });
                await localforage.setItem(currentBookKey, file);
            }
        }
        async function updateBookmarkList() {
            const file = await localforage.getItem(currentBookKey);
            const list = document.getElementById('bookmarkList'); list.innerHTML = '';
            (file.bookmarks || []).forEach(b => {
                const d = document.createElement('div');
                d.className = "p-3 bg-indigo-50 dark:bg-gray-800 rounded-xl cursor-pointer";
                d.innerText = b.name;
                d.onclick = () => { rendition.display(b.loc); toggleDrawer(); };
                list.appendChild(d);
            });
        }
        function applyHighlight(c) {
            const s = window.getSelection();
            if (s.rangeCount) {
                const r = s.getRangeAt(0);
                const m = document.createElement('mark');
                m.className = c; r.surroundContents(m);
            }
            document.getElementById('highlightMenu').style.display = 'none';
        }
        document.addEventListener('mouseup', (e) => {
            const s = window.getSelection();
            if (s.toString().length > 2) {
                const m = document.getElementById('highlightMenu');
                m.style.display = 'flex'; m.style.top = `${e.clientY - 60}px`; m.style.left = `${e.clientX - 50}px`;
            } else document.getElementById('highlightMenu').style.display = 'none';
        });
        function clearSelection() { window.getSelection().removeAllRanges(); }
        function closeReader() { location.reload(); }
        document.getElementById('themeToggle').onclick = () => document.body.classList.toggle('dark-mode');
    </script>
</body>
</html>
